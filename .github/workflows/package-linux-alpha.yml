name: Package Zion A.D. Linux alpha
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and smoke-test Pyrogenesis"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/package-linux-alpha.yml"
      - "tests/restore-upstream-029-art.sh"
      - "tests/verify-linux-package.sh"
      - "binaries/data/mods/public/simulation/components/PlayerManager.js"
      - "binaries/data/mods/public/simulation/helpers/Player.js"
      - "binaries/data/mods/public/gamesettings/attributes/PlayerCiv.js"
      - "tests/verify-legacy-player-civ.cjs"
      - "tests/verify-game-settings-civ.cjs"
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  package:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          lfs: false
      - name: Check native legacy civilization mapping
        run: |
          node --check binaries/data/mods/public/simulation/helpers/Player.js
          node tests/verify-legacy-player-civ.cjs
          node --check binaries/data/mods/public/gamesettings/attributes/PlayerCiv.js
          node tests/verify-game-settings-civ.cjs
      - name: Find verified native engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh api 'repos/DalmoMendonca/zion/actions/artifacts?name=zion-native-linux-smoke&per_page=50' --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .workflow_run.id')"
          fi
          test -n "$run_id" && test "$run_id" != "null"
          echo "Native engine build run: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          repository: DalmoMendonca/zion
          run-id: ${{ steps.engine.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: zion-native-linux-smoke
          path: .engine
      - name: Restore executable and required native libraries
        run: |
          set -euo pipefail
          engine="$(find .engine -type f -name pyrogenesis | head -1)"
          test -n "$engine"
          cp "$engine" binaries/system/pyrogenesis
          chmod +x binaries/system/pyrogenesis
          while IFS= read -r lib; do cp "$lib" binaries/system/; done < <(
            find .engine -type f \( -name 'libmozjs*.so*' -o -name 'libCollada*.so*' -o -name 'libnv*.so*' \)
          )
          test -f binaries/system/libCollada.so
          find binaries/system -maxdepth 1 -iname 'libnvtt*.so*' -print -quit | grep .
      - name: Restore verified upstream art from official 0 A.D. release 28
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream-assets
          (
            cd .upstream-assets
            file="0ad-0.28.0-unix-data.tar.xz"
            curl -fL --retry 4 --retry-delay 10 -o "$file" "https://releases.wildfiregames.com/$file"
            curl -fL --retry 4 --retry-delay 10 -o "$file.sha256sum" "https://releases.wildfiregames.com/$file.sha256sum"
            sha256sum -c "$file.sha256sum"
          )
          bundle=".upstream-assets/0ad-0.28.0-unix-data.tar.xz"
          # The upstream tarball has a versioned root directory. Never extract
          # over Zion's loose scripts: restore ZIP art into a separate tree.
          mkdir -p .upstream-assets/unpacked binaries/data/mods/public binaries/data/mods/mod
          tar -xJf "$bundle" -C .upstream-assets/unpacked
          public_zip="$(find .upstream-assets/unpacked -type f -name public.zip -print -quit)"
          mod_zip="$(find .upstream-assets/unpacked -type f -name mod.zip -print -quit)"
          test -n "$public_zip" && test -n "$mod_zip"
          test "$(stat -c %s "$public_zip")" -gt 100000000
          mv "$public_zip" binaries/data/mods/public/public.zip
          mv "$mod_zip" binaries/data/mods/mod/mod.zip
          test -s binaries/data/mods/public/public.zip
          # Remove placeholder LFS pointers that would shadow the real ZIP art.
          python3 - <<'PY'
          from pathlib import Path
          removed=0
          for base in ("binaries/data/mods/public", "binaries/data/mods/mod"):
              for file in Path(base).rglob("*"):
                  if file.is_file() and file.stat().st_size < 256:
                      with file.open("rb") as stream:
                          is_pointer=stream.read(64).startswith(b"version https://git-lfs.github.com/spec/v1")
                      if is_pointer:
                          file.unlink()
                          removed+=1
          print("Removed stale LFS placeholder assets:",removed)
          PY
          # The release-28 ZIP also contains old scripts. VFS defines no stable
          # precedence between ZIP entries and loose files at equal priority.
          # Restore licensed ART only so Zion's current gameplay/autostart code wins.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          allow=("art/", "audio/", "fonts/", "maps/scenarios/", "maps/skirmishes/", "shaders/", "textures/")
          public=Path("binaries/data/mods/public/public.zip")
          target=public.parent
          restored=0
          with ZipFile(public) as archive:
              assert "maps/scenarios/sandbox_athenians.pmp" in archive.namelist()
              for member in archive.infolist():
                  dest=target/member.filename
                  if member.filename.startswith(allow) and not member.is_dir() and not dest.exists():
                      archive.extract(member,target)
                      restored+=1
          assert restored>100, "No authentic public art restored"
          public.unlink()
          # The base mod's genuine fonts are required for GUI startup, but its
          # scripts must not shadow this native fork's current bootstrap.
          base=Path("binaries/data/mods/mod/mod.zip")
          with ZipFile(base) as archive:
              for member in archive.infolist():
                  dest=base.parent/member.filename
                  if member.filename.startswith("fonts/") and not member.is_dir() and not dest.exists():
                      archive.extract(member,base.parent)
          base.unlink()
          for name in ("LinBiolinum_Rah.ttf", "LinBiolinum_RBah.ttf", "DejaVuSansMono.ttf"):
              assert (Path("binaries/data/mods/mod/fonts")/name).stat().st_size>1024, "Missing GUI font "+name
          assert (target/"maps/scenarios/sandbox_athenians.pmp").stat().st_size>100000
          print("ZION_PACKAGE_ART_OK: authentic art restored without old script shadowing:",restored)
          PY
          df -h .
      - name: Restore matching original 0.29-development water and UI art
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends subversion
          bash -n tests/restore-upstream-029-art.sh
          bash tests/restore-upstream-029-art.sh binaries/data/mods/public
      - name: Create relocatable Linux archive
        run: |
          set -euo pipefail
          mkdir -p dist/ZionAD/binaries
          cp -a binaries/system dist/ZionAD/binaries/
          cp -a binaries/data dist/ZionAD/binaries/
          cp LICENSE.md license_gpl-2.0.txt license_lgpl-2.1.txt license_mit.txt dist/ZionAD/
          cat > dist/ZionAD/play-zion.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$root/binaries/system"
          export LD_LIBRARY_PATH="$PWD:${LD_LIBRARY_PATH:-}"
          mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/0ad/mods"
          exec ./pyrogenesis -mod=public -quickstart "$@"
          SH
          chmod +x dist/ZionAD/play-zion.sh
          cat > dist/ZionAD/README.txt <<'TXT'
          Zion A.D. — experimental Linux desktop alpha
          Run ./play-zion.sh from this folder. Requires a Linux desktop
          with compatible graphics drivers and the native 0 A.D. runtime
          dependencies (SDL2, OpenGL, Boost, wxWidgets and related libraries).
          This is a test package, not yet a verified M1 release.
          In the game setup choose the Zion / First Covenant victory condition.
          TXT
          tar -C dist -czf ZionAD-linux-alpha.tar.gz ZionAD
          sha256sum ZionAD-linux-alpha.tar.gz > ZionAD-linux-alpha.tar.gz.sha256
          ls -lh ZionAD-linux-alpha.tar.gz
      - name: Install native runtime dependencies for clean-package test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdb libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcurl4-gnutls-dev libenet-dev libfmt-dev libfreetype-dev \
            libgloox-dev libicu-dev libminiupnpc-dev libogg-dev \
            libopenal-dev libpng-dev libsdl2-dev libsodium-dev \
            libvorbis-dev libwxgtk3.2-dev libxml2-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev
      - name: Launch and inspect the actual extracted Linux package
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/verify-linux-package.sh
          mkdir -p dist/diagnostics
          export ZION_PACKAGE_LOG_PATH="$PWD/dist/diagnostics/package-game.log"
          export ZION_PACKAGE_BACKTRACE_PATH="$PWD/dist/diagnostics/package-backtrace.log"
          bash tests/verify-linux-package.sh ZionAD-linux-alpha.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZionAD-linux-package-smoke-log
          path: dist/diagnostics/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ZionAD-linux-alpha
          path: |
            ZionAD-linux-alpha.tar.gz
            ZionAD-linux-alpha.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

      # GitHub's authenticated classic commit statuses are queryable even when
      # this connector cannot list Actions workflow runs. Preserve the exact
      # triggering source revision and permanent job URL for diagnostics.
      - name: Publish verifiable native gate result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZION_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ZION_JOB_RESULT: ${{ job.status }}
          ZION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$ZION_JOB_RESULT" == "success" ]]; then
            state=success
          else
            state=failure
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$ZION_SOURCE_SHA" \
            -f state="$state" \
            -f context="zion/linux-package" \
            -f description="Extracted clean-home Linux alpha smoke" \
            -f target_url="$ZION_RUN_URL"
          echo "ZION_CI_GATE_REPORTED: zion/linux-package $state at $ZION_SOURCE_SHA $ZION_RUN_URL"
