name: Rapid Pyrogenesis gameplay smoke
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-fast-smoke.yml"
      - "tests/run-zion-native-mode.sh"
      - "binaries/data/mods/public/maps/scripts/Zion*"
      - "binaries/data/mods/public/simulation/ai/petra/**"
      - "binaries/data/mods/public/simulation/data/settings/victory_conditions/zion*.json"
permissions:
  contents: read
  actions: read
jobs:
  native-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      # An engine binary may be valid even if a script smoke test failed later.
      # Select the newest retained artifact, not just a run with success status.
      - name: Discover newest compiled Pyrogenesis artifact
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api 'repos/DalmoMendonca/zion/actions/artifacts?name=zion-native-linux-smoke&per_page=50' --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .workflow_run.id')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No compiled native engine artifact is retained."
            exit 1
          fi
          echo "Using compiled engine from run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Restore precompiled Pyrogenesis engine
        uses: actions/download-artifact@v4
        with:
          repository: DalmoMendonca/zion
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: zion-native-linux-smoke
          path: .native-cache
      - name: Install native engine runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcurl4-gnutls-dev libenet-dev libfmt-dev libfreetype-dev \
            libgloox-dev libicu-dev libminiupnpc-dev libogg-dev \
            libopenal-dev libpng-dev libsdl2-dev libsodium-dev \
            libvorbis-dev libwxgtk3.2-dev libxml2-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev
      - name: Locate executable and game engine shared libraries
        run: |
          set -euxo pipefail
          find .native-cache -maxdepth 10 -type f -name 'libmozjs*.so*' -print
          engine="$(find .native-cache -type f -name pyrogenesis | head -1)"
          test -n "$engine"
          cp "$engine" binaries/system/pyrogenesis
          chmod +x binaries/system/pyrogenesis
          while IFS= read -r lib; do cp "$lib" binaries/system/; done < <(
            find .native-cache -type f \( -name 'libmozjs*.so*' -o -name 'libCollada*.so*' -o -name 'libnv*.so*' \)
          )
          export LD_LIBRARY_PATH="$(pwd)/binaries/system:${LD_LIBRARY_PATH:-}"
          ldd binaries/system/pyrogenesis
          ! ldd binaries/system/pyrogenesis | grep 'not found'
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Obtain original scenario assets for nonvisual simulation
        run: |
          git lfs install --local
          git lfs pull --include="binaries/data/mods/public/maps/scenarios/arcadia.pmp,binaries/data/mods/public/art/animation/biped/citizen/idle_relax_f.dae,binaries/data/mods/public/art/animation/biped/citizen/walk_relax_f.dae,binaries/data/mods/public/art/animation/biped/citizen/build.dae,binaries/data/mods/public/art/animation/biped/gatherer/farming.dae,binaries/data/mods/public/art/animation/biped/gatherer/gather_wood.dae,binaries/data/mods/public/art/animation/biped/gatherer/carry_grain_f.dae" --exclude=""
      - name: Verify actual restored citizen, harvesting and construction animation files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = ["binaries/data/mods/public/art/animation/biped/citizen/idle_relax_f.dae","binaries/data/mods/public/art/animation/biped/citizen/walk_relax_f.dae","binaries/data/mods/public/art/animation/biped/citizen/build.dae","binaries/data/mods/public/art/animation/biped/gatherer/farming.dae","binaries/data/mods/public/art/animation/biped/gatherer/gather_wood.dae","binaries/data/mods/public/art/animation/biped/gatherer/carry_grain_f.dae"]
          for raw in paths:
              p = Path(raw)
              data = p.read_bytes()
              assert len(data) > 512, f"Missing or unhydrated animation: {p} ({len(data)} bytes)"
              assert not data.startswith(b"version https://git-lfs.github.com/spec/v1"), f"LFS pointer: {p}"
              assert b"COLLADA" in data[:8192], f"Not a COLLADA animation: {p}"
              print(f"ZION_ANIMATION_ASSET_OK: {p} ({len(data)} bytes)")
          PY
      - name: Launch built engine with current Zion scripts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.local/share/0ad/mods"
          cd binaries/system
          set +e
          timeout --signal=TERM 12s ./pyrogenesis \
            -autostart="scenarios/arcadia" -autostart-victory=zion \
            -autostart-nonvisual -autostart-disable-replay \
            -nosound -quickstart >engine-smoke.log 2>&1
          code=$?
          set -e
          tail -60 engine-smoke.log
          grep -F "GAME STARTED, ALL INIT COMPLETE" engine-smoke.log || exit 1
          grep -F "ZION_NATIVE_READY" engine-smoke.log
          grep -F "ZION_GOVERNANCE_TECH_OK" engine-smoke.log
          grep -F "ZION_SOCIAL_TICK_OK" engine-smoke.log || exit 1
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed' engine-smoke.log; then exit 1; fi
          test "$code" -eq 0 -o "$code" -eq 124
      - name: Exercise two governance progressions in actual simulation
        shell: bash
        run: |
          set -uo pipefail
          cd binaries/system
          set +e
          timeout --signal=TERM 14s ./pyrogenesis \
            -autostart="scenarios/arcadia" -autostart-victory=zion_e2e \
            -autostart-nonvisual -autostart-disable-replay \
            -nosound -quickstart >zion-e2e.log 2>&1
          code=$?
          set -e
          grep -En "ZION_|ERROR:|JavaScript error:|exception|failed|GAME STARTED" zion-e2e.log | tail -80 || true
          tail -30 zion-e2e.log
          grep -F "ZION_E2E_FIRST_RESEARCH_OK" zion-e2e.log
          grep -F "ZION_E2E_TOWN_OK" zion-e2e.log
          grep -F "ZION_E2E_PATH_EXCLUSIVITY_OK" zion-e2e.log
          grep -F "ZION_E2E_BOTH_PATHS_OK" zion-e2e.log
          grep -F "ZION_FIRST_COVENANT_WON" zion-e2e.log
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed|ZION_E2E_FAILED' zion-e2e.log; then
            tail -100 zion-e2e.log
            exit 1
          fi
          test "$code" -eq 0 -o "$code" -eq 124
      - name: Verify native worker movement command
        shell: bash
        run: |
          set -uo pipefail
          cd binaries/system
          set +e
          timeout --signal=TERM 24s ./pyrogenesis \
            -autostart="scenarios/arcadia" -autostart-victory=zion_movement \
            -autostart-nonvisual -autostart-disable-replay \
            -nosound -quickstart >zion-movement.log 2>&1
          code=$?
          set -e
          grep -F "ZION_MOVEMENT_ORDER_OK" zion-movement.log
          grep -F "ZION_MOVEMENT_VERIFIED" zion-movement.log
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed|ZION_MOVEMENT_FAILED' zion-movement.log; then
            tail -100 zion-movement.log
            exit 1
          fi
          test "$code" -eq 0 -o "$code" -eq 124
      - name: Verify native unit training and population growth
        shell: bash
        run: |
          set -uo pipefail
          cd binaries/system
          set +e
          timeout --signal=TERM 45s ./pyrogenesis \
            -autostart="scenarios/arcadia" -autostart-victory=zion_training \
            -autostart-nonvisual -autostart-disable-replay \
            -nosound -quickstart >zion-training.log 2>&1
          code=$?
          set -e
          grep -F "ZION_TRAINING_QUEUED" zion-training.log
          grep -F "ZION_TRAINING_VERIFIED" zion-training.log
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed|ZION_TRAINING_FAILED' zion-training.log; then
            tail -100 zion-training.log
            exit 1
          fi
          test "$code" -eq 0 -o "$code" -eq 124
      - name: Verify food gathering and Civic Centre deposit
        id: native_gather
        continue-on-error: true
        shell: bash
        run: bash tests/run-zion-native-mode.sh gather ZION_GATHER_ORDER_OK ZION_GATHER_DEPOSIT_VERIFIED 95
      - name: Verify house foundation construction and completion
        id: native_construction
        continue-on-error: true
        shell: bash
        run: bash tests/run-zion-native-mode.sh construction ZION_CONSTRUCTION_PLACED ZION_CONSTRUCTION_VERIFIED 165
      - name: Verify infantry attack damage against enemy unit
        id: native_combat
        continue-on-error: true
        shell: bash
        run: bash tests/run-zion-native-mode.sh combat ZION_COMBAT_ORDER_OK ZION_COMBAT_DAMAGE_VERIFIED 75
      - name: Verify Petra AI opponent actually gathers and expands
        id: native_ai
        continue-on-error: true
        shell: bash
        run: bash tests/run-zion-native-mode.sh ai_observation ZION_AI_OPPONENT_ACTIVE ZION_AI_CIVIC_RESEARCH_OK 105
      - name: Enforce all independent native integration results
        if: always()
        run: |
          test '${{ steps.native_gather.outcome }}' = 'success'
          test '${{ steps.native_construction.outcome }}' = 'success'
          test '${{ steps.native_combat.outcome }}' = 'success'
          test '${{ steps.native_ai.outcome }}' = 'success'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zion-rapid-smoke-log
          if-no-files-found: warn
          path: |
            binaries/system/engine-smoke.log
            binaries/system/zion-e2e.log
            binaries/system/zion-movement.log
            binaries/system/zion-training.log
            binaries/system/zion-gather.log
            binaries/system/zion-construction.log
            binaries/system/zion-combat.log
            binaries/system/zion-ai_observation.log
