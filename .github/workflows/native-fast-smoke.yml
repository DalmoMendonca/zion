name: Rapid Pyrogenesis gameplay smoke
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-fast-smoke.yml"
      - "binaries/data/mods/public/maps/scripts/Zion*"
      - "binaries/data/mods/public/simulation/data/settings/victory_conditions/zion.json"
permissions:
  contents: read
  actions: read
jobs:
  native-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      # An engine binary may be valid even if a script smoke test failed later.
      # Select the newest retained artifact, not just a run with success status.
      - name: Discover newest compiled Pyrogenesis artifact
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api 'repos/DalmoMendonca/zion/actions/artifacts?name=zion-native-linux-smoke&per_page=50' --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .workflow_run.id')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No compiled native engine artifact is retained."
            exit 1
          fi
          echo "Using compiled engine from run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Restore precompiled Pyrogenesis engine
        uses: actions/download-artifact@v4
        with:
          repository: DalmoMendonca/zion
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: zion-native-linux-smoke
          path: .native-cache
      - name: Install native engine runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcurl4-gnutls-dev libenet-dev libfmt-dev libfreetype-dev \
            libgloox-dev libicu-dev libminiupnpc-dev libogg-dev \
            libopenal-dev libpng-dev libsdl2-dev libsodium-dev \
            libvorbis-dev libwxgtk3.2-dev libxml2-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev
      - name: Locate executable and game engine shared libraries
        run: |
          set -euxo pipefail
          find .native-cache -maxdepth 10 -type f -name 'libmozjs*.so*' -print
          engine="$(find .native-cache -type f -name pyrogenesis | head -1)"
          test -n "$engine"
          cp "$engine" binaries/system/pyrogenesis
          chmod +x binaries/system/pyrogenesis
          while IFS= read -r lib; do cp "$lib" binaries/system/; done < <(
            find .native-cache -type f \( -name 'libmozjs*.so*' -o -name 'libCollada*.so*' -o -name 'libnv*.so*' \)
          )
          export LD_LIBRARY_PATH="$(pwd)/binaries/system:${LD_LIBRARY_PATH:-}"
          ldd binaries/system/pyrogenesis
          ! ldd binaries/system/pyrogenesis | grep 'not found'
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Obtain original scenario assets for nonvisual simulation
        run: |
          git lfs install --local
          git lfs pull --include="binaries/data/mods/public/maps/scenarios/arcadia.pmp" --exclude=""
      - name: Launch built engine with current Zion scripts
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.local/share/0ad/mods"
          cd binaries/system
          set +e
          timeout --signal=TERM 12s ./pyrogenesis \
            -autostart="scenarios/arcadia" -autostart-victory=zion \
            -autostart-nonvisual -autostart-disable-replay \
            -nosound -quickstart >engine-smoke.log 2>&1
          code=$?
          set -e
          tail -60 engine-smoke.log
          grep -F "GAME STARTED, ALL INIT COMPLETE" engine-smoke.log || exit 1
          grep -F "ZION_NATIVE_READY" engine-smoke.log
          grep -F "ZION_GOVERNANCE_TECH_OK" engine-smoke.log
          grep -F "ZION_SOCIAL_TICK_OK" engine-smoke.log || exit 1
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed' engine-smoke.log; then exit 1; fi
          test "$code" -eq 0 -o "$code" -eq 124
      - name: Exercise two governance progressions in actual simulation
        shell: bash
        run: |
          set -uo pipefail
          cd binaries/system
          set +e
          timeout --signal=TERM 14s ./pyrogenesis \
            -autostart="scenarios/arcadia" -autostart-victory=zion_e2e \
            -autostart-nonvisual -autostart-disable-replay \
            -nosound -quickstart >zion-e2e.log 2>&1
          code=$?
          set -e
          grep -F "ZION_E2E_NEGATIVE_FOOD_OK" zion-e2e.log
          grep -F "ZION_E2E_FIRST_RESEARCH_OK" zion-e2e.log
          grep -F "ZION_E2E_TOWN_OK" zion-e2e.log
          grep -F "ZION_E2E_BOTH_PATHS_OK" zion-e2e.log
          grep -F "ZION_FIRST_COVENANT_WON" zion-e2e.log
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed|ZION_E2E_FAILED' zion-e2e.log; then
            tail -100 zion-e2e.log
            exit 1
          fi
          test "$code" -eq 0 -o "$code" -eq 124
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zion-rapid-smoke-log
          if-no-files-found: warn
          path: |
            binaries/system/engine-smoke.log
            binaries/system/zion-e2e.log
