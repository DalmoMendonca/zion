name: Zion A.D. graphical engine smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and smoke-test Pyrogenesis"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/native-graphical-smoke.yml"
      - "tests/restore-upstream-029-art.sh"
      - "binaries/data/mods/public/gui/session/**"
      - "binaries/data/mods/public/simulation/components/GuiInterface.js"
      - "binaries/data/mods/public/simulation/components/PlayerManager.js"
      - "binaries/data/mods/public/simulation/helpers/Player.js"
      - "binaries/data/mods/public/gamesettings/attributes/PlayerCiv.js"
      - "tests/player-manager-colors.test.cjs"
      - "tests/verify-legacy-player-civ.cjs"
      - "tests/verify-game-settings-civ.cjs"
      - "binaries/data/mods/public/maps/scripts/ZionModel.js"
      - "binaries/data/mods/public/maps/scripts/ZionVictory.js"
      - "binaries/data/mods/public/simulation/data/settings/victory_conditions/zion*.json"
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  graphical:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
      SDL_VIDEODRIVER: "x11"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          lfs: false
          fetch-depth: 1
      - name: Check native player setup and color preservation
        run: |
          node --check binaries/data/mods/public/simulation/components/PlayerManager.js
          node tests/player-manager-colors.test.cjs
          node tests/verify-legacy-player-civ.cjs
          node tests/verify-game-settings-civ.cjs
      - name: Select source-compatible compiled engine for this checkout or triggering runSelect compiled Linux engine
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # The triggering native build must match the checked-out revision.
            run_id="${{ github.event.workflow_run.id }}"
            test -n "$run_id"
          else
            # Build artifacts can finish in a different order from commits.
            # Do not mistake most-recent upload time for most-recent source.
            # Check the compiled C++ source trees, not the artifact timestamp.
            run_id=""
            while IFS=$'\t' read -r candidate candidate_sha; do
              test -n "$candidate" && test -n "$candidate_sha" || continue
              git fetch --quiet --no-tags --depth=1 origin "$candidate_sha"
              if git diff --quiet "$candidate_sha" HEAD -- source/ build/ libraries/; then
                run_id="$candidate"
                echo "ZION_NATIVE_COMPATIBLE_ARTIFACT: $candidate at $candidate_sha"
                break
              fi
              echo "Skipping incompatible engine artifact $candidate ($candidate_sha)"
            done < <(
              gh api 'repos/${{ github.repository }}/actions/artifacts?name=zion-native-linux-smoke&per_page=100' \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[] | [.workflow_run.id, .workflow_run.head_sha] | @tsv'
            )
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "::error::No retained Pyrogenesis engine artifact matches checked-out C++ sources."
            exit 1
          fi
          echo "ZION_NATIVE_SELECTED_RUN=$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Verify binary and source revision compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZION_NATIVE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          native_sha="$(gh api "repos/${{ github.repository }}/actions/runs/$ZION_NATIVE_RUN_ID" --jq '.head_sha')"
          checkout_sha="$(git rev-parse HEAD)"
          test -n "$native_sha" && test "$native_sha" != "null"
          git fetch --quiet --no-tags --depth=1 origin "$native_sha"
          if ! git diff --quiet "$native_sha" "$checkout_sha" -- source/ build/ libraries/; then
            echo "::error::Compiled native engine ($native_sha) does not match this checkout ($checkout_sha) under source/, build/, or libraries/."
            echo "A matching native build is required; never accept a mismatched binary."
            exit 1
          fi
          echo "ZION_NATIVE_BINARY_SOURCE_MATCH_OK: engine=$native_sha checkout=$checkout_sha"
      - uses: actions/download-artifact@v4
        with:
          repository: DalmoMendonca/zion
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: zion-native-linux-smoke
          path: .engine
      - name: Install graphics and game runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth scrot xdotool mesa-utils libgl1-mesa-dri git-lfs python3-pil python3-numpy \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcurl4-gnutls-dev libenet-dev libfmt-dev libfreetype-dev \
            libgloox-dev libicu-dev libminiupnpc-dev libogg-dev \
            libopenal-dev libpng-dev libsdl2-dev libsodium-dev \
            libvorbis-dev libwxgtk3.2-dev libxml2-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev
      - name: Restore executable and Mozilla runtime
        run: |
          set -euxo pipefail
          engine="$(find .engine -type f -name pyrogenesis | head -1)"
          test -n "$engine"
          cp "$engine" binaries/system/pyrogenesis
          chmod +x binaries/system/pyrogenesis
          while IFS= read -r lib; do
            cp "$lib" binaries/system/
          done < <(find .engine -type f \( -name 'libmozjs*.so*' -o -name 'libCollada*.so*' -o -name 'libnv*.so*' \))
          test -f binaries/system/libCollada.so
          find binaries/system -maxdepth 1 -iname 'libnvtt*.so*' -print -quit | grep .
          echo "LD_LIBRARY_PATH=$(pwd)/binaries/system:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/share/0ad/mods"
          ldd binaries/system/pyrogenesis
          ! ldd binaries/system/pyrogenesis | grep 'not found'
      - name: Restore official release 28 artwork without broken bulk Git LFS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream-assets
          (
            cd .upstream-assets
            file="0ad-0.28.0-unix-data.tar.xz"
            curl -fL --retry 4 --retry-delay 10 -o "$file" "https://releases.wildfiregames.com/$file"
            curl -fL --retry 4 --retry-delay 10 -o "$file.sha256sum" "https://releases.wildfiregames.com/$file.sha256sum"
            sha256sum -c "$file.sha256sum"
          )
          bundle=".upstream-assets/0ad-0.28.0-unix-data.tar.xz"
          # The upstream tarball has a versioned root directory. Never extract
          # over Zion's loose scripts: restore ZIP art into a separate tree.
          mkdir -p .upstream-assets/unpacked binaries/data/mods/public binaries/data/mods/mod
          tar -xJf "$bundle" -C .upstream-assets/unpacked
          public_zip="$(find .upstream-assets/unpacked -type f -name public.zip -print -quit)"
          mod_zip="$(find .upstream-assets/unpacked -type f -name mod.zip -print -quit)"
          test -n "$public_zip" && test -n "$mod_zip"
          test "$(stat -c %s "$public_zip")" -gt 100000000
          mv "$public_zip" binaries/data/mods/public/public.zip
          mv "$mod_zip" binaries/data/mods/mod/mod.zip
          test -s binaries/data/mods/public/public.zip
          # Keep the fork's loose Zion code, but remove unusable Git LFS
          # placeholder files so packaged original art resolves from ZIP.
          python3 - <<'PY'
          from pathlib import Path
          removed=0
          for base in ("binaries/data/mods/public", "binaries/data/mods/mod"):
              for file in Path(base).rglob("*"):
                  if file.is_file() and file.stat().st_size < 256:
                      with file.open("rb") as stream:
                          is_pointer=stream.read(64).startswith(b"version https://git-lfs.github.com/spec/v1")
                      if is_pointer:
                          file.unlink()
                          removed+=1
          print("Removed stale LFS placeholder assets:",removed)
          PY
          # The terrain is already in the authentic, checksum-verified
          # public.zip; do not query the broken Git LFS endpoint again.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path("binaries/data/mods/public/public.zip")
          assert p.stat().st_size>100000000, "Official public.zip missing or still placeholder"
          allow=("art/", "audio/", "fonts/", "maps/scenarios/", "maps/skirmishes/", "shaders/", "textures/")
          target=Path("binaries/data/mods/public")
          count=0
          with ZipFile(p) as game:
              names=game.namelist()
              assert any(x.endswith("maps/scenarios/sandbox_athenians.pmp") for x in names), "Sandbox terrain missing from official game data"
              for entry in game.infolist():
                  destination=target/entry.filename
                  if entry.filename.startswith(allow) and not entry.is_dir() and not destination.exists():
                      # Keep the newer fork's scenario XML, scripts and artwork where present.
                      game.extract(entry,target)
                      count+=1
          assert count>100, "Official release art missing unexpectedly"
          print("Extracted authentic visual assets without replacing Zion scripts:",count)
          p.unlink()
          # Fonts are shipped in upstream base mod.zip, not public.zip.
          # Restore only the licensed fonts, preserving Zion bootstrap scripts.
          base=Path("binaries/data/mods/mod/mod.zip")
          with ZipFile(base) as original_mod:
              fonts=[entry for entry in original_mod.infolist() if entry.filename.startswith("fonts/") and not entry.is_dir()]
              assert len(fonts)>=3, "Official base mod is missing font assets"
              for entry in fonts:
                  original_mod.extract(entry, Path("binaries/data/mods/mod"))
          for font in ("LinBiolinum_Rah.ttf", "LinBiolinum_RBah.ttf", "DejaVuSansMono.ttf"):
              assert (Path("binaries/data/mods/mod/fonts")/font).stat().st_size > 1024, "Missing rendered HUD font: "+font
          print("Restored base-mod fonts:", len(fonts))
          base.unlink()
          PY
      - name: Restore matching original 0.29-development water and UI art
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends subversion
          bash -n tests/restore-upstream-029-art.sh
          bash tests/restore-upstream-029-art.sh binaries/data/mods/public
      - name: Render actual 3D gameplay after the loading screen closes
        shell: bash
        run: |
          mkdir -p screenshots
          cat > ./capture-zion.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export SDL_VIDEODRIVER=x11
          cd binaries/system
          timeout --signal=TERM 250s ./pyrogenesis \
            -autostart="scenarios/sandbox_athenians" \
            -autostart-victory=zion \
            -autostart-disable-replay \
            -nosound -quickstart -windowed -xres=1280 -yres=720 \
            >graphical.log 2>&1 &
          pid=$!
          # The larger Arcadia scenario (4205 entities) previously timed out under llvmpipe.
          # Combat demo has 234 entities and exercises real native terrain, units and UI.
          # A fixed 16-second sleep previously captured the loading screen
          # and nevertheless passed the test. Wait for the real game marker.
          ready=0
          for attempt in $(seq 1 210); do
            if grep -Fq "GAME STARTED, ALL INIT COMPLETE" graphical.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Pyrogenesis exited before the match started"
              tail -80 graphical.log
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Graphical RTS failed to load before timeout"
            exit 1
          fi
          hud_ready=0
          for attempt in $(seq 1 150); do
            if grep -Fq "ZION_SOCIAL_TICK_OK" graphical.log; then
              hud_ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$hud_ready" -ne 1 ]; then
            echo "Society HUD never received a live report before capture"
            tail -80 graphical.log
            exit 1
          fi
          sleep 2
          scrot -o ../../screenshots/zion-graphical.png
          # Exercise the ACTUAL SDL/X11 RTS input path, rather than merely
          # asserting that the interface code contains selection handlers.
          # These coordinates enclose the controllable soldiers in the fixed
          # sandbox_athenians screenshot at 1280x720 (central plaza).
          xdotool mousemove --sync 690 360 mousedown 1
          sleep 0.2
          xdotool mousemove --sync 856 503
          sleep 0.2
          xdotool mouseup 1
          sleep 2
          scrot -o ../../screenshots/zion-selected.png
          # An unobstructed plaza target; right click gives a real RTS order.
          xdotool mousemove --sync 915 360 click 3
          sleep 8
          scrot -o ../../screenshots/zion-ordered.png
          # Native simulation serialization round-trip via the normal GUI
          # shortcuts (Shift+F5 quicksave / Shift+F8 quickload). This is
          # in-memory quicksave, not yet disk save/reload acceptance.
          xdotool key --clearmodifiers shift+F5
          sleep 3
          xdotool key --clearmodifiers shift+F8
          sleep 3
          grep -F "Quicksaved game" graphical.log
          grep -F "Quickloaded game" graphical.log
          echo "ZION_NATIVE_QUICKSAVE_RELOAD_OK: simulation serializes and reloads via GUI"
          # The frame and live simulation are already verified. Do not waste
          # four additional minutes waiting for the 250s watchdog to expire.
          kill -TERM "$pid" 2>/dev/null || true
          set +e
          wait "$pid"
          code=$?
          set -e
          echo "GRAPHICAL_ENGINE_EXIT=$code"
          # 143 is the expected explicit termination after capture.
          test "$code" -eq 0 -o "$code" -eq 143
          SH
          xvfb-run -a -s '-screen 0 1280x720x24' bash ./capture-zion.sh
          test -s screenshots/zion-graphical.png
          python3 - <<'PY'
          from PIL import Image, ImageStat
          image=Image.open("screenshots/zion-graphical.png").convert("RGB")
          assert image.size == (1280,720), f"Unexpected frame: {image.size}"
          viewport=image.crop((350, 110, 1120, 630))
          deviation=ImageStat.Stat(viewport).stddev
          print("3D viewport RGB standard deviation:",deviation)
          assert max(deviation)>=12, "3D viewport is blank/unrendered"
          parchment=image.crop((840,210,1040,480))
          pixels=list(parchment.getdata())
          matches=sum(1 for red,green,blue in pixels if
            155<=red<=230 and 125<=green<=210 and 75<=blue<=165
            and red>green+10 and green>blue+15)
          parchment_share=matches/len(pixels)
          print("Loading-screen parchment share:",round(parchment_share,3))
          assert parchment_share < 0.70, "Still showing loading parchment, not gameplay"
          world=image.crop((370,190,1050,600))
          black_share=sum(1 for r,g,b in world.getdata() if max(r,g,b)<18)/(world.width*world.height)
          print("Near-black gameplay viewport share:",round(black_share,3))
          assert black_share<0.75, "Most of the world is unrendered/black"
          hud=image.crop((830,44,1210,124))
          white_text=sum(1 for r,g,b in hud.getdata() if min(r,g,b)>180)
          print("Society HUD bright text pixels:",white_text)
          assert white_text>=30, "Society HUD is not visible in captured frame"
          PY
          python3 - <<'PY'
          from PIL import Image, ImageChops
          baseline = Image.open("screenshots/zion-graphical.png").convert("RGB")
          selected = Image.open("screenshots/zion-selected.png").convert("RGB")
          ordered = Image.open("screenshots/zion-ordered.png").convert("RGB")
          for frame in (selected, ordered):
              assert frame.size == baseline.size, "RTS input capture changed display resolution"
          # Bottom game controls are normally blank without a selection;
          # selected entities populate the native unit command/details UI.
          box = (332, 526, 1275, 710)
          before = baseline.crop(box)
          after = selected.crop(box)
          import numpy as np
          a = np.asarray(before, dtype=np.int16)
          b = np.asarray(after, dtype=np.int16)
          changed = np.any(np.abs(a-b) > 28, axis=2)
          fraction = float(np.mean(changed))
          print("ZION_RTS_SELECTION_PANEL_PIXEL_CHANGE:", round(fraction, 4))
          assert fraction > 0.01, "Mouse drag did not visibly populate native RTS selection panel"
          world = (680, 355, 990, 510)
          a = np.asarray(selected.crop(world), dtype=np.int16)
          b = np.asarray(ordered.crop(world), dtype=np.int16)
          changed = np.any(np.abs(a-b) > 35, axis=2)
          fraction = float(np.mean(changed))
          print("ZION_RTS_ORDER_WORLD_PIXEL_CHANGE:", round(fraction, 4))
          assert fraction > 0.005, "Right-click order caused no visible world change"
          print("ZION_RTS_INPUT_VISUAL_OK: live native GUI responded to drag selection and right click")
          PY
          tail -75 binaries/system/graphical.log
          file screenshots/zion-graphical.png
          grep -F "ZION_NATIVE_READY" binaries/system/graphical.log
          grep -F "GAME STARTED, ALL INIT COMPLETE" binaries/system/graphical.log
          grep -F "ZION_SOCIAL_TICK_OK" binaries/system/graphical.log
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed|GUI object has no setting' binaries/system/graphical.log; then
            echo "Native GUI/engine diagnostics include errors or invalid styles"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zion-graphical-diagnostics
          if-no-files-found: warn
          path: |
            screenshots/zion-graphical.png
            screenshots/zion-selected.png
            screenshots/zion-ordered.png
            binaries/system/graphical.log

      # GitHub's authenticated classic commit statuses are queryable even when
      # this connector cannot list Actions workflow runs. Preserve the exact
      # triggering source revision and permanent job URL for diagnostics.
      - name: Publish verifiable native gate result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZION_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ZION_JOB_RESULT: ${{ job.status }}
          ZION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$ZION_JOB_RESULT" == "success" ]]; then
            state=success
          else
            state=failure
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$ZION_SOURCE_SHA" \
            -f state="$state" \
            -f context="zion/graphical" \
            -f description="Rendered native gameplay and GUI controls" \
            -f target_url="$ZION_RUN_URL"
          echo "ZION_CI_GATE_REPORTED: zion/graphical $state at $ZION_SOURCE_SHA $ZION_RUN_URL"
