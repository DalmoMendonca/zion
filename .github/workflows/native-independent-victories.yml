name: Independent Zion civic victories in native engine
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-independent-victories.yml"
      - "binaries/data/mods/public/maps/scripts/Zion*"
      - "binaries/data/mods/public/simulation/data/settings/victory_conditions/zion_e2e*.json"
permissions:
  contents: read
  actions: read
jobs:
  independent-victories:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Find compiled native engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api 'repos/DalmoMendonca/zion/actions/artifacts?name=zion-native-linux-smoke&per_page=50' --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | first | .workflow_run.id')"
          test -n "$run_id" && test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          repository: DalmoMendonca/zion
          run-id: ${{ steps.engine.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: zion-native-linux-smoke
          path: .native-cache
      - name: Restore runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev libboost-system-dev libboost-filesystem-dev libcurl4-gnutls-dev libenet-dev libfmt-dev libfreetype-dev libgloox-dev libicu-dev libminiupnpc-dev libogg-dev libopenal-dev libpng-dev libsdl2-dev libsodium-dev libvorbis-dev libwxgtk3.2-dev libxml2-dev libxcursor-dev libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev git-lfs
          engine="$(find .native-cache -type f -name pyrogenesis | head -1)"
          test -n "$engine"
          cp "$engine" binaries/system/pyrogenesis
          chmod +x binaries/system/pyrogenesis
          while IFS= read -r lib; do cp "$lib" binaries/system/; done < <(find .native-cache -type f \( -name 'libmozjs*.so*' -o -name 'libCollada*.so*' -o -name 'libnv*.so*' \))
          echo "LD_LIBRARY_PATH=$(pwd)/binaries/system:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          git lfs install --local
          git lfs pull --include="binaries/data/mods/public/maps/scenarios/arcadia.pmp" --exclude=""
      - name: Run two independent native victory matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/0ad/mods"
          cd binaries/system
          for scenario in zion_e2e zion_e2e_alternate; do
            set +e
            timeout --signal=TERM 20s ./pyrogenesis -autostart="scenarios/arcadia" -autostart-victory="$scenario" -autostart-nonvisual -autostart-disable-replay -nosound -quickstart >"$scenario.log" 2>&1
            code=$?
            set -e
            grep -F 'GAME STARTED, ALL INIT COMPLETE' "$scenario.log"
            grep -F 'ZION_E2E_BOTH_PATHS_OK' "$scenario.log"
            grep -F 'ZION_E2E_PATH_EXCLUSIVITY_OK' "$scenario.log"
            if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed|ZION_E2E_ALT_FAILED|ZION_E2E_FAILED' "$scenario.log"; then exit 1; fi
            test "$code" -eq 0 -o "$code" -eq 124
          done
          grep -F 'ZION_FIRST_COVENANT_WON: player 1 ' zion_e2e.log
          grep -F 'ZION_E2E_ALT_CONTROL_OK' zion_e2e_alternate.log
          grep -F 'ZION_FIRST_COVENANT_WON: player 2 ' zion_e2e_alternate.log
          echo 'ZION_TWO_INDEPENDENT_NATIVE_VICTORIES_OK'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zion-independent-victories-logs
          path: |
            binaries/system/zion_e2e.log
            binaries/system/zion_e2e_alternate.log
