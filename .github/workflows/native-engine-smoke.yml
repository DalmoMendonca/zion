name: Build and smoke-test Pyrogenesis
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-engine-smoke.yml"
      - "binaries/data/mods/public/maps/scripts/Zion*"
      - "binaries/data/mods/public/simulation/data/settings/victory_conditions/zion.json"
      - "binaries/data/mods/public/simulation/data/technologies/zion*"
      - "binaries/data/mods/public/simulation/data/technologies/pair_zion*"
      - "binaries/data/mods/public/gui/session/Zion*"
permissions:
  contents: read
jobs:
  linux-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_LFS_SKIP_SMUDGE: "1"
      MAKEFLAGS: "-j3"
    steps:
      - name: Checkout real 0 A.D. fork without LFS downloads
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Check runner disk capacity and build environment
        run: |
          df -h .
          uname -a
          gcc --version | head -1
          rustc --version
          cargo --version
          git lfs version
      - name: Install native engine dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cargo cmake curl git-lfs pkg-config python3 m4 \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcurl4-gnutls-dev libenet-dev libfmt-dev libfreetype-dev \
            libgloox-dev libicu-dev libminiupnpc-dev libogg-dev \
            libopenal-dev libpng-dev libsdl2-dev libsodium-dev \
            libvorbis-dev libwxgtk3.2-dev libxml2-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev \
            llvm subversion zlib1g-dev xvfb
      # Mozilla 128's Rust target detection breaks with Rust >= 1.98
      # (Mozilla bug 2053518, October 2026): pin the last unaffected Rust.
      - name: Select Mozilla-compatible Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version
      - name: Install Mozilla's required cbindgen helper
        run: |
          cargo install --locked cbindgen@0.29.0
          cbindgen --version
      - name: Compile 0 A.D. third-party dependencies
        run: |
          export JOBS=-j3
          bash libraries/build-source-libs.sh --without-nvtt --with-system-cxxtest -j3
      - name: Generate native makefiles
        run: |
          bash build/workspaces/update-workspaces.sh \
            --with-system-cxxtest --without-nvtt --without-atlas --without-lobby \
            --without-tests --without-audio
      - name: Compile Pyrogenesis engine from fork
        run: |
          make -C build/workspaces/gcc -j3 config=release
          test -x binaries/system/pyrogenesis
          binaries/system/pyrogenesis -version
      - name: Fetch real scenario data from the upstream LFS server
        run: |
          git lfs install --local
          git lfs pull --include='binaries/data/mods/public/maps/scenarios/arcadia.pmp' --exclude=''
          test "$(stat -c %s binaries/data/mods/public/maps/scenarios/arcadia.pmp)" -gt 100000
      - name: Run native Zion victory and assert initialization
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/0ad/mods"
          cd binaries/system
          set +e
          timeout --signal=TERM 9s ./pyrogenesis \
            -autostart="scenarios/arcadia" \
            -autostart-victory=zion \
            -autostart-nonvisual \
            -autostart-disable-replay \
            -nosound -quickstart >engine-smoke.log 2>&1
          code=$?
          set -e
          echo "Pyrogenesis exit: $code"
          grep -F "GAME STARTED, ALL INIT COMPLETE" engine-smoke.log
          grep -F "ZION_NATIVE_READY" engine-smoke.log
          grep -F "ZION_GOVERNANCE_TECH_OK" engine-smoke.log
          grep -F "ZION_SOCIAL_TICK_OK" engine-smoke.log
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed' engine-smoke.log; then
            echo "Unexpected Pyrogenesis JavaScript or simulation error."
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
          echo "Native Zion script loaded cleanly in Pyrogenesis"
      - name: Upload diagnostics and native binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zion-native-linux-smoke
          if-no-files-found: warn
          path: |
            binaries/system/engine-smoke.log
            binaries/system/pyrogenesis
            binaries/system/libmozjs*.so*
            libraries/source/spidermonkey/lib/libmozjs*.so*
            ~/.local/state/0ad/log/
          retention-days: 7
