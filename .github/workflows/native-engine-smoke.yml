name: Build and smoke-test Pyrogenesis
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-engine-smoke.yml"
      - "source/**"
      - "build/**"
      - "libraries/**"
permissions:
  contents: read
  statuses: write
jobs:
  linux-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_LFS_SKIP_SMUDGE: "1"
      MAKEFLAGS: "-j3"
    steps:
      - name: Checkout real 0 A.D. fork without LFS downloads
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Check runner disk capacity and build environment
        run: |
          df -h .
          uname -a
          gcc --version | head -1
          rustc --version
          cargo --version
          git lfs version
      - name: Install native engine dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cargo cmake curl git-lfs pkg-config python3 m4 \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcurl4-gnutls-dev libenet-dev libfmt-dev libfreetype-dev \
            libgloox-dev libicu-dev libminiupnpc-dev libogg-dev \
            libopenal-dev libpng-dev libsdl2-dev libsodium-dev \
            libvorbis-dev libwxgtk3.2-dev libxml2-dev libxcursor-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev \
            llvm subversion zlib1g-dev xvfb
      # Mozilla 128's Rust target detection breaks with Rust >= 1.98
      # (Mozilla bug 2053518, October 2026): pin the last unaffected Rust.
      - name: Select Mozilla-compatible Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version
      - name: Install Mozilla's required cbindgen helper
        run: |
          cargo install --locked cbindgen@0.29.0
          cbindgen --version
      - name: Compile 0 A.D. third-party dependencies
        run: |
          export JOBS=-j3
          bash libraries/build-source-libs.sh --with-system-cxxtest -j3
      - name: Generate native makefiles
        run: |
          bash build/workspaces/update-workspaces.sh \
            --with-system-cxxtest --without-atlas --without-lobby \
            --without-tests --without-audio
      - name: Compile Pyrogenesis engine from fork
        run: |
          make -C build/workspaces/gcc -j3 config=release
          test -x binaries/system/pyrogenesis
          binaries/system/pyrogenesis -version
          ldd binaries/system/pyrogenesis | tee binaries/system/native-dependencies.txt
          if grep -F "not found" binaries/system/native-dependencies.txt; then
            echo "Native executable has unresolved shared-library dependencies."
            exit 1
          fi
          # Actual rendered game requires conversion DLLs even if a headless
          # match passes. Do not mistake a no-NVTT executable for a 3D build.
          test -f binaries/system/libCollada.so
          find binaries/system -maxdepth 1 -iname 'libnvtt*.so*' -print -quit | grep .
      - name: Restore Arcadia terrain from checksum-verified upstream art
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream-native
          (
            cd .upstream-native
            file="0ad-0.28.0-unix-data.tar.xz"
            curl -fL --retry 4 --retry-delay 10 -o "$file" "https://releases.wildfiregames.com/$file"
            curl -fL --retry 4 --retry-delay 10 -o "$file.sha256sum" "https://releases.wildfiregames.com/$file.sha256sum"
            sha256sum -c "$file.sha256sum"
          )
          mkdir -p .upstream-native/unpacked
          tar -xJf .upstream-native/0ad-0.28.0-unix-data.tar.xz -C .upstream-native/unpacked
          public_zip="$(find .upstream-native/unpacked -type f -name public.zip -print -quit)"
          test -n "$public_zip"
          python3 - "$public_zip" <<'PY'
          import shutil, sys
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              for name in ("arcadia", "sandbox_athenians"):
                  dest = Path("binaries/data/mods/public/maps/scenarios") / (name+".pmp")
                  entry = archive.getinfo("maps/scenarios/"+name+".pmp")
                  assert entry.file_size > 100_000, "Upstream "+name+" terrain is incomplete"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as source, dest.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  assert dest.stat().st_size > 100_000, "Map is still a Git LFS pointer"
                  print("ZION_NATIVE_TERRAIN_OK:",name,dest.stat().st_size)
          PY
      - name: Run native Zion victory and assert initialization
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/0ad/mods"
          cd binaries/system
          # The lightweight native sandbox uses 234 entities, whereas Arcadia
          # has 4,205 and can exceed a hard nine-second startup deadline.
          timeout --signal=TERM --kill-after=5s 120s ./pyrogenesis \
            -autostart="scenarios/sandbox_athenians" \
            -autostart-victory=zion \
            -autostart-nonvisual \
            -autostart-disable-replay \
            -nosound -quickstart >engine-smoke.log 2>&1 &
          pid=$!
          ready=0
          for attempt in $(seq 1 105); do
            if grep -Fq "GAME STARTED, ALL INIT COMPLETE" engine-smoke.log && \
               grep -Fq "ZION_NATIVE_READY" engine-smoke.log && \
               grep -Fq "ZION_GOVERNANCE_TECH_OK" engine-smoke.log && \
               grep -Fq "ZION_SOCIAL_TICK_OK" engine-smoke.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          tail -80 engine-smoke.log
          if [ "$ready" -ne 1 ]; then
            echo "Native game did not initialize and advance to a society report"
            exit 1
          fi
          if grep -Ei '(^| )ERROR:|JavaScript error:|unhandled exception|assertion failed' engine-smoke.log; then
            echo "Unexpected Pyrogenesis JavaScript or simulation error."
            exit 1
          fi
          echo "ZION_NATIVE_ENGINE_OK: headless Pyrogenesis began a real match and sampled society"
      - name: Upload diagnostics and native binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zion-native-linux-smoke
          if-no-files-found: warn
          path: |
            binaries/system/engine-smoke.log
            binaries/system/native-dependencies.txt
            binaries/system/pyrogenesis
            binaries/system/libmozjs*.so*
            binaries/system/libCollada*.so*
            binaries/system/libnv*.so*
            libraries/source/nvtt/bin/libnv*.so*
            libraries/source/spidermonkey/lib/libmozjs*.so*
            ~/.local/state/0ad/log/
          retention-days: 7

      # GitHub's authenticated classic commit statuses are queryable even when
      # this connector cannot list Actions workflow runs. Preserve the exact
      # triggering source revision and permanent job URL for diagnostics.
      - name: Publish verifiable native gate result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZION_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ZION_JOB_RESULT: ${{ job.status }}
          ZION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$ZION_JOB_RESULT" == "success" ]]; then
            state=success
          else
            state=failure
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/$ZION_SOURCE_SHA" \
            -f state="$state" \
            -f context="zion/native-engine" \
            -f description="Compiled Pyrogenesis native engine and headless society smoke" \
            -f target_url="$ZION_RUN_URL"
          echo "ZION_CI_GATE_REPORTED: zion/native-engine $state at $ZION_SOURCE_SHA $ZION_RUN_URL"
