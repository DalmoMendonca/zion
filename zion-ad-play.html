    const eligible=EVENTS.filter(e=>e.min<=s.year && s.usedEvents.indexOf(e.id)<0);
    if(!eligible.length) { const prior=EVENTS.filter(e=>e.min<=s.year); return prior[(Math.floor(s.year/50))%prior.length]; }
    const hash=(Math.imul(1664525,(s.seed ^ Math.imul(s.turn+1,2654435761))>>>0)+1013904223)>>>0;
    return eligible[Math.floor((hash/4294967296)*eligible.length)];
  }
  function availableGovernance(s){return GOVERNANCE.filter(g=>s.year>=g.year);}
  function costOf(s,p,g) {
    const reform = g.id===s.governance?0:6;
    const upkeep = p.id==='volunteers' && reform===0 ? Math.min(g.upkeep,Math.max(0,s.treasury)) : g.upkeep;
    return p.cost+reform+upkeep;
  }
  function advance(s, opts){
    if(s.completed)throw new Error('The campaign has ended');
    const p=PROJECTS.find(x=>x.id===opts.project);if(!p)throw new Error('Choose a valid project');
    const g=GOVERNANCE.find(x=>x.id===(opts.governance||s.governance));if(!g||g.year>s.year)throw new Error('Governance unavailable');
    const costs=costOf(s,p,g);
    if(costs>s.treasury)throw new Error('Insufficient treasury');
    const next=copy(s), before=diagnose(next.metrics);
    next.treasury-=costs;next.governance=g.id;
    apply(next.metrics,p.effects);apply(next.metrics,g.effects);
    const event=EVENTS.find(e=>e.id===opts.eventId && e.min<=s.year);
    if(!event)throw new Error('Event no longer valid');
    const choice=event.choices[opts.choice];if(!choice)throw new Error('Invalid response');
    apply(next.metrics,choice.effects);
    next.usedEvents.push(event.id);
    const m=next.metrics;
    // Dynamic interdependence: abundance improves capacity; ecological stress undermines it.
    const income=11+Math.floor(m.prosperity/5)+Math.floor(m.provision/12);
    const needs=8+Math.floor(next.population/1700);
    next.treasury=clamp(next.treasury+income-needs,0,250);
    if(m.ecology<40){apply(m,{provision:-3,resilience:-3});}
    if(m.dignity<35||m.freedom<25)apply(m,{communion:-3,resilience:-2});
    if(m.communion<30)apply(m,{prosperity:-2});
    if(m.provision<25)apply(m,{dignity:-4,communion:-2});
    if(m.wisdom>70&&m.freedom>60)apply(m,{resilience:1});
    if(m.ecology>70&&m.provision>55)apply(m,{resilience:1});
    const pressure=next.turn>0&&next.turn%5===4 ? 3:1;
    // Historical shocks and institutional entropy prevent endless effortless compounding.
    apply(m,{provision:-pressure,prosperity:-1,dignity:-1,freedom:-1,wisdom:-1,communion:-2,ecology:-2,resilience:-2});
    next.population=Math.max(30,Math.round(next.population*(1+(m.provision-35)/850)));
    next.year=Math.min(2000, s.year+50);next.turn++;
    const report=diagnose(m);
    if(report.floor<12)next.collapseYears++;else next.collapseYears=0;
    next.legacy+=report.score;
    next.history.push({year:next.year,project:p.id,governance:g.id,event:event.id,choice:opts.choice,score:report.score,stage:report.stage,treasury:next.treasury,metrics:copy(m),delta:report.score-before.score});
    next.completed=next.year>=2000||next.collapseYears>=3;
    return next;
  }
  function outcome(s){const d=diagnose(s.metrics);return {won:s.year>=2000&&d.flourishing,score:d.score,stage:d.stageName,year:s.year,description:s.collapseYears>=3?'Institutional collapse':d.flourishing?'A durable, unfinished Zion':'The covenant remains unfinished',diagnosis:d};}
  function observeRTS(obs){
    // Game-world proxy measurements, not a claim to quantify consciousness or actual justice.
    const metrics={
      provision:clamp(22+obs.food/20+obs.farms*7+obs.houses*0.8,0,100),
      prosperity:clamp(19+obs.trade/80+obs.markets*11+obs.civics*6+obs.metal/120,0,100),
      dignity:clamp(28+obs.houses*4+obs.healers*11+obs.temples*2,0,100),
      freedom:clamp(35+obs.markets*7+obs.civics*6+obs.houses*1.3-obs.fortresses*7,0,100),
      wisdom:clamp(24+obs.temples*11+obs.healers*5+obs.civics*4+obs.techs*2,0,100),
      communion:clamp(32+obs.temples*7+obs.houses*2+obs.tributes/60-obs.kills*0.7,0,100),
      ecology:clamp(75-obs.woodGathered/180+obs.farms*3,0,100),
      resilience:clamp(26+obs.towers*5+obs.civics*8+obs.healers*4+obs.food/120,0,100)
    };
    return diagnose(metrics);
  }
  return {KEYS:KEYS,TITLES:TITLES,QUADRANTS:QUADRANTS,STAGES:STAGES,GOVERNANCE:GOVERNANCE,PROJECTS:PROJECTS,EVENTS:EVENTS,create:create,diagnose:diagnose,availableGovernance:availableGovernance,eventFor:eventFor,costOf:costOf,advance:advance,outcome:outcome,observeRTS:observeRTS};
})();
if (typeof module !== 'undefined' && module.exports) module.exports = ZionCore;

</script>
  <script>
/* Browser campaign UI. Uses the same GPL ZionCore as the 0 A.D. mod. */
(function() {
'use strict';
const $=id=>document.getElementById(id);
const STORAGE='zion-ad-campaign-v1';
const saved=()=>{try{return JSON.parse(localStorage.getItem(STORAGE));}catch(e){return null;}};
let state=saved()||ZionCore.create(43);
let undo=[];
let selected='harvest', selectedGovernment=state.governance, selectedChoice=0;
let message='';
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function effectLabel(effects){return Object.entries(effects).map(([k,v])=>(v>0?'+':'')+v+' '+ZionCore.TITLES[k].toLowerCase()).join(' · ')}
function skyline(){
 const m=state.metrics;const n=8+Math.floor(state.year/180)+Math.floor(m.prosperity/12);
 let buildings='';
 for(let i=0;i<n;i++){
   const x=40+(i*137%795),y=215-(i*61%98),h=19+(i*17%44)+(state.year>900?8:0),w=14+i%3*4;
   const roof=i%4===0?'#b27c57':i%4===1?'#d3b77d':'#cc9873';
   const wall=i%3===0?'#f3e5c4':i%3===1?'#ddd5b1':'#e8cfa5';
   buildings+=`<g opacity="${i%6===0?.67:1}"><path d="M${x} ${y-h} l${w/2} -${w/2*.6} ${w/2} ${w/2*.6} v${h} h-${w}z" fill="${wall}"/><path d="M${x} ${y-h} l${w/2} -${w/2*.6} ${w/2} ${w/2*.6}z" fill="${roof}"/><path d="M${x+w*.44} ${y-10}v-8 h${w*.24}v8" fill="#977f5a"/><rect x="${x+w*.22}" y="${y-h+9}" width="3" height="4" fill="#7c9c9b" /></g>`;
 }
 let trees='';const green= Math.max(7,Math.floor(m.ecology*.50));for(let i=0;i<green;i++){
  const x=(i*79+21)%940,y=205+(i*37%90),r=4+(i*7)%9;
  trees+=`<g><rect x="${x}" y="${y-4}" width="2" height="10" fill="#7d7954"/><circle cx="${x+1}" cy="${y-8}" r="${r}" fill="${i%3?'#719c7c':'#59866e'}" opacity="${i%5?'.9':'.65'}"/></g>`;
 }
 return `<svg viewBox="0 0 940 310" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylized settlement, growing as society develops"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4e8e4"/><stop offset="1" stop-color="#eaf0d9"/></linearGradient><linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7baea8"/><stop offset="1" stop-color="#aecac3"/></linearGradient></defs><rect width="940" height="310" fill="url(#sky)"/><circle cx="760" cy="58" r="38" fill="#f5e7b8" opacity=".84"/><path d="M0 134Q100 78 240 142T530 135T940 127V310H0Z" fill="#b8c7a7"/><path d="M0 173Q210 100 360 168T940 160V310H0Z" fill="#94b29b"/><path d="M0 220Q250 159 440 204T940 180V310H0Z" fill="#87aa88"/><path d="M0 259Q150 208 310 260T630 247T940 223V310H0Z" fill="#69967b"/><path d="M400 310Q280 263 441 233T485 177Q470 160 462 147L509 149Q544 185 513 215T597 276L670 310Z" fill="url(#river)"/><path d="M400 310Q280 263 441 233T485 177" stroke="#c8dfd7" stroke-width="3" fill="none" opacity=".75"/>${buildings}<path d="M0 286Q250 245 430 276T940 262V310H0Z" fill="#669276" opacity=".68"/>${trees}<path d="M0 306Q200 278 330 303T690 297T940 300" fill="none" stroke="#e0c397" stroke-width="4" opacity=".8"/></svg>`;
}
function graph(){const hist=[{year:1,score:ZionCore.diagnose(ZionCore.create(1).metrics).score},...state.history];const points=hist.map((h,i)=>`${12+i*(570/39)},${104-h.score}`).join(' ');return `<svg viewBox="0 0 598 115" role="img" aria-label="Societal flourishing score across centuries"><line x1="12" y1="25" x2="585" y2="25" stroke="#e3e9df"/><line x1="12" y1="55" x2="585" y2="55" stroke="#e3e9df"/><line x1="12" y1="85" x2="585" y2="85" stroke="#e3e9df"/><polyline fill="none" stroke="#3b826c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${points}"/><circle cx="${12+(hist.length-1)*(570/39)}" cy="${104-hist[hist.length-1].score}" r="5" fill="#bc9654"/></svg>`;}
function metricCard(k){const v=state.metrics[k];return `<div class="metric"><div class="metric-title"><span>${ZionCore.TITLES[k]}</span><b>${Math.round(v)}</b></div><div class="bar"><div class="bar-fill ${v<37?'warning':''}" style="width:${v}%"></div></div></div>`}
function quadrantCards(diag){return diag.quadrants.map(q=>`<div class="quad-item"><div class="mini">${q.name}</div><strong>${q.value} <small>/ 100</small></strong></div>`).join('')}
function render(){
 const diag=ZionCore.diagnose(state.metrics);const event=ZionCore.eventFor(state), gov=ZionCore.GOVERNANCE.find(g=>g.id===selectedGovernment)||ZionCore.GOVERNANCE[0], proj=ZionCore.PROJECTS.find(p=>p.id===selected)||ZionCore.PROJECTS[0];
 const cost=ZionCore.costOf(state,proj,gov);const cannot=state.treasury<cost;
 const pct=Math.round((state.year-1)/1999*100);
 const history=state.history.slice(-4).reverse();
 $('game').innerHTML=`
  <section class="hero"><div><div class="eyebrow">An experiment in becoming · The common good</div><h1>What if we built <em>Zion?</em></h1><p>From the first century to the twenty-first. Every fifty years, choose what to cultivate, how to govern, and whose needs to honor. Power is easy to accumulate; a civilization that flourishes together is harder to build.</p></div><div class="big-year"><span>Year of the covenant</span><strong>${state.year.toLocaleString()}</strong></div></section>
  <div class="century"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-label">${pct}% of 2,000 years</span></div>
  <section class="dashboard">
   <article class="panel"><div class="landscape">${skyline()}<div class="landscape-legend">THE LIVING COMMONS</div><div class="landscape-caption">${esc(gov.name)} · ${state.population.toLocaleString()} citizens</div></div><div class="panel-body"><div class="panel-heading"><h2>The condition of our world</h2><span class="legend">Balance before dominance</span></div><div class="metrics">${ZionCore.KEYS.map(metricCard).join('')}</div></div></article>
   <article class="panel"><div class="panel-body"><div class="panel-heading"><h2>Flourishing</h2></div><div class="score-row"><div class="score-left"><div><strong>${diag.score}</strong><small> / 100</small></div><div class="stage">${diag.stageName}</div><div class="subtext">Developmental center</div></div><div class="score-ring" style="--pct:${diag.score}%"><span><b>${diag.floor}</b>weakest<br>dimension</span></div></div><div class="quad">${quadrantCards(diag)}</div><div class="ledger"><div><small>Public treasury</small><b>${state.treasury}</b></div><div><small>Period</small><b>${state.turn+1} <span style="font-size:13px">/ 40</span></b></div></div><p class="hint">Integral development is uneven: an impressive institution may conceal a neglected neighbor. Victory requires all four quadrants.</p></div></article>
   ${state.completed ? `<article class="panel event-panel"><div class="panel-body"><div class="event-top">THE TWO-THOUSAND-YEAR COVENANT</div><div class="eyebrow">The final reckoning</div><h2>${ZionCore.outcome(state).won?'A flourishing commonwealth':'An unfinished commonwealth'}</h2><p class="subtext">The measure of success is whether provision, freedom, dignity, wisdom and creation care endure together.</p></div></article>` : `<article class="panel event-panel"><div class="panel-body"><div class="event-top">THE QUESTION OF THIS GENERATION</div><div class="eyebrow">${Math.min(2000,state.year+49)} A.D. · Dilemma</div><h2>${esc(event.title)}</h2><p class="subtext">${esc(event.text)}</p><div class="choice-group">${event.choices.map((x,i)=>`<button class="choice-card ${selectedChoice===i?'selected':''}" data-choice="${i}" aria-pressed="${selectedChoice===i}"><strong>${esc(x.text)}</strong><small>${esc(effectLabel(x.effects))}</small></button>`).join('')}</div><p class="hint" style="color:#bad0bd">Every path has consequences. Care without capacity, prosperity without justice, and order without freedom all carry risks.</p></div></article>`}
  </section>
  ${state.completed?ending():`<section class="decision-section"><article class="panel"><div class="panel-body"><div class="panel-heading"><h2>Choose what to cultivate</h2><span class="legend">One investment · fifty years</span></div><div class="projects">${ZionCore.PROJECTS.map(p=>`<button class="choice-card project-option ${selected===p.id?'selected':''}" data-project="${p.id}" aria-pressed="${selected===p.id}"><span class="domain">${p.domain}</span><strong>${p.name}</strong><small>${p.desc}</small><span class="cost">Cost ${p.cost}</span></button>`).join('')}</div></div></article><article class="panel"><div class="panel-body"><div class="panel-heading"><h2>Structure society</h2><span class="legend">Reform can be costly</span></div><p class="subtext">No institution is a magic solution. Different arrangements shape liberties, trust, prosperity, and resilience.</p><select id="governance" class="gov-picker" aria-label="Government structure">${ZionCore.availableGovernance(state).map(g=>`<option value="${g.id}" ${g.id===selectedGovernment?'selected':''}>${g.name}</option>`).join('')}</select><div class="gov-box"><strong>${gov.name}</strong><p>${gov.intro}</p><p>${esc(effectLabel(gov.effects))}</p></div><div class="ledger"><div><small>Available</small><b>${state.treasury}</b></div><div><small>Total investment</small><b>${cost}</b></div></div><button id="advance" class="play-action" ${cannot?'disabled':''}>Lead the next fifty years <span>→</span></button>${cannot?'<div class="message">Insufficient funds. Select Neighborly service, or choose a less expensive governing arrangement.</div>':''}${message?`<div class="message">${esc(message)}</div>`:''}<p class="hint">This is a turn-based societal simulation. The 0 A.D. mod contains the complementary real-time 3D challenge.</p></div></article></section>`}
  <section class="chronicle"><article class="panel"><div class="panel-body"><div class="panel-heading"><h3>The long arc</h3><span class="legend">Flourishing over time</span></div><div class="chart-wrap">${graph()}</div></div></article><article class="panel"><div class="panel-body"><div class="panel-heading"><h3>Chronicle of decisions</h3><span class="legend">A civilization is made of choices</span></div><div class="history">${history.length?history.map(h=>`<div class="history-line"><strong>Year ${h.year}</strong>${esc(ZionCore.PROJECTS.find(p=>p.id===h.project)?.name||h.project)} · ${esc(h.governance)} · score ${h.score} (${h.delta>=0?'+':''}${h.delta})</div>`).join(''):'<div class="history-line">Your first century is still unwritten.</div>'}</div></div></article></section>`;
 document.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.project;message='';render()}));
 document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{selectedChoice=Number(b.dataset.choice);render()}));
 const g=$('governance');if(g)g.addEventListener('change',()=>{selectedGovernment=g.value;render()});
 const adv=$('advance');if(adv)adv.addEventListener('click',()=>{try{undo.push(JSON.stringify(state));if(undo.length>2)undo.shift();state=ZionCore.advance(state,{project:selected,governance:selectedGovernment,eventId:event.id,choice:selectedChoice});save();selectedChoice=0;selectedGovernment=state.governance;message='';window.scrollTo({top:0,behavior:'smooth'});render()}catch(e){message=e.message;render()}});
 const restart=$('restart');if(restart)restart.addEventListener('click',reset);
}
function ending(){const o=ZionCore.outcome(state);return `<section class="ending"><div class="eyebrow">The year 2000 · The reckoning</div><h2>${o.won?'Zion takes root.':'The work remains unfinished.'}</h2><p>${o.won?'The most vulnerable are not abandoned, institutions remain accountable, and land and neighbor alike can flourish. It is a continuing covenant, not a perfect end state.':'You traveled '+state.turn+' generations and reached a final flourishing score of '+o.score+'. Zion is not an empire to capture. The challenge is to shape institutions, cultures and relationships that let every member flourish.'}</p><button id="restart">Begin another civilization →</button></section>`}
function reset(){if(state.turn&&!window.confirm('Begin a new civilization? Your current campaign will be replaced.'))return;state=ZionCore.create(Math.floor(Math.random()*1e9));selectedGovernment=state.governance;selected='harvest';selectedChoice=0;message='';save();render();window.scrollTo({top:0})}
$('reset').addEventListener('click',reset);render();
})();
